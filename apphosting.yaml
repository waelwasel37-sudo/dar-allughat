  - variable: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
    value: AIzaSyBazLf9qCoXwrjx77SiH8Qs1MeGOLdtoGI

settings:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memory: "1GiB"

headers:
  - path: "/.*"
    headers:
      - key: "Strict-Transport-Security"
        value: "max-age=31536000; includeSubDomains; preload"
      - key: "X-Content-Type-Options"
        value: "nosniff"
      - key: "X-Frame-Options"
        value: "SAMEORIGIN"
      - key: "X-XSS-Protection"
        value: "1; mode=block"
      - key: "Referrer-Policy"
        value: "strict-origin-when-cross-origin"
      # 🎯 السطر الذهبي المفقود الذي سيجبر المتصفح على تسلّم وزرع الكوكيز الناجحة بسلام
      - key: "Cross-Origin-Opener-Policy"
        value: "same-origin-allow-popups"
