name: Deploy to Firebase Hosting on Push
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. التحديث إلى أحدث إصدار فرعي متوافق مع Node 24 مجاناً
      - uses: actions/checkout@v4.2.2

      # 2. خطوة إجبارية لتثبيت البيئة المستقرة المتوافقة مع Next.js الحالي
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci
        
      - name: Build Next.js App
        run: npm run build
        
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DAR_ALLUGHAT }}
          projectId: dar-allughat-97483992-fc6c5
