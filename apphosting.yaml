# See https://google.com
version: 1

# المجلد الأساسي للتطبيق
app: .

# أوامر البناء والتشغيل الافتراضية
buildCommand: npm run build
startCommand: npm start

# إعدادات الأسرار والمتغيرات البيئية
env:
  - variable: FIREBASE_SERVICE_ACCOUNT_JSON
    secret: FIREBASE_SERVICE_ACCOUNT_JSON
    availability:
      - RUNTIME

# إعدادات السيرفر والأداء
server:
  concurrency: 500
  maxInstances: 10
  minInstances: 0
  cpu: 1
  memory: 512MiB
  timeout: 30s