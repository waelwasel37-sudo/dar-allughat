# إصدار مواصفات الاستضافة المستقر
version: 1

# 🛠️ خطوة البناء: تثبيت الحزم وبناء النسخة النهائية من المتجر
build:
  run: npm install && npm run build

# 🚀 خطوة التشغيل: تشغيل خادم Next.js مع الإعدادات الأمثل
run:
  command: npm run start
  cpu: 1
  memoryMiB: 1024
  minInstances: 0
  maxInstances: 10
  concurrency: 80

# 🔐 متغيرات البيئة والأسرار: أسماء الأسرار مجردة بدون روابط (الفايربيس يربطها تلقائياً)
env:
  - variable: SECRET_COOKIE_PASSWORD
    secret: SECRET_COOKIE_PASSWORD

  - variable: FIREBASE_SERVICE_ACCOUNT_JSON
    secret: FIREBASE_SERVICE_ACCOUNT_JSON

  # المتغيرات العامة للمتجر المحدثة والمطابقة 100% مع الـ firebaseConfig الحي
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyCifHupsbt8tcIfzkBa1hpcH5j4vM4VihU"
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "://firebaseapp.com"
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "dar-allughat-97483992-fc6c5"
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "dar-allughat-97483992-fc6c5.firebasestorage.app"
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "118615668327"
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:118615668327:web:f90af8e5d121f5a71a06c2"
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: "G-7SQ2EK8VDC"
  
  # المتغير المطلوب لتشغيل موجز المنتجات بشكل صحيح باللغة العربية
  - variable: NEXT_PUBLIC_SITE_URL
    value: "https://hosted.app"

  - variable: NEXT_PUBLIC_META_PIXEL_ID
    value: "2031832027677972"
  - variable: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
    value: "AIzaSyBazLf9qCoXwrjx77SiH8Qs1MeGOLdtoGI"

# 🌐 ترويسات الاستجابة: إضافة طبقات أمان وتوافق تسجيل الدخول بجوجل
headers:
  - path: "/**"
    headers:
      - key: "Strict-Transport-Security"
        value: "max-age=31536000; includeSubDomains; preload"
      - key: "X-Content-Type-Options"
        value: "nosniff"
      - key: "X-Frame-Options"
        value: "SAMEORIGIN"
      - key: "X-XSS-Protection"
        value: "1; mode=block"
      - key: "Referrer-Policy"
        value: "strict-origin-when-cross-origin"
      - key: "Cross-Origin-Opener-Policy"
        value: "same-origin-allow-popups"
